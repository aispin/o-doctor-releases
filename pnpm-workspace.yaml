packages:
  - "apps/*"

# 全仓库唯一版本来源。新 app 一律写 "catalog:"，禁止在各自的 package.json 里写死版本。
catalogMode: strict

catalog:
  react: ^19.3.1
  react-dom: ^19.3.1
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@types/node": ^26.6.5

  typescript: ^7.0.2
  vite: ^8.3.5
  "@vitejs/plugin-react": ^6.1.2

  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  tw-animate-css: ^1.4.0

  three: ^0.186.1
  "@types/three": ^0.186.0

  lucide-react: ^1.61.0
  class-variance-authority: ^0.7.1
  tailwind-merge: ^3.7.0
  clsx: ^2.1.1
  radix-ui: ^1.8.1

  gh-pages: ^6.3.0

# pnpm 10+ 默认拦截依赖的构建脚本，这里显式放行
onlyBuiltDependencies:
  - esbuild